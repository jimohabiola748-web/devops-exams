name: Python Docker CI

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t python-web-app .

      - name: Run Docker container
        run: docker run -d -p 5000:5000 --name my-python-container python-web-app

      - name: Verify Python web server is running
        run: |
          sleep 5
          curl http://localhost:5000
